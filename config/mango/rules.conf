####################
### Window Rules ###
####################

# To Get appid or title, use xprox, like xprop | grep WM_NAME
# or badass mmsh -g -c




# Thunar File Manager
window_rule=is_floating:1,width:900,height:600,animation_type_open:zoom,animation_type_close:zoom,app_id:Thunar

# Pavucontrol
window_rule=is_floating:1,width:500,height:300,offset_x:100,offset_y:-100,animation_type_open:slide,animation_type_close:slide,app_id:org.pulseaudio.pavucontrol

#Blueman-manager
window_rule=is_floating:1,width:550,height:300,offset_x:100,offset_y:-100,animation_type_open:slide,animation_type_open:slide,app_id:blueman-manager

# Fuzzel
layer_rule=animation_type_open:zoom,layer_name:launcher
layer_rule=animation_type_close:zoom,layer_name:launcher

# Mako
layer_rule=no_shadow:1,layer_name:notifications

### Screenshot
layer_rule=animation_type_open:zoom,animation_type_close:none,layer_name:selection
layer_rule=animation_type_open:none,animation_type_close:fade,layer_name:wayfreeze
window_rule=is_floating:1,width:1280,height:720,animation_type_open:zoom,animation_type_close:fade,app_id:satty

### Telegram
window_rule=is_floating:1,animation_type_open:zoom,animation_type_close:fade,title:Media viewer


### GAMES

# Steam
window_rule=is_floating:1,width:300,height:600,title:Friends List
window_rule=is_floating:1,title:Steam Settings

# Prism Launcher
window_rule=is_floating:1,width:300,height:900,title:Console window
window_rule=is_floating:1,app_id:Minecraft

# Mod Organizer 2
window_rule=no_border:1,title:ModOrganizer
window_rule=is_floating:1,width:900,height:600,title:STALKER Anomaly – Mod Organizer v2.5.2
