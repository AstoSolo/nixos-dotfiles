####################
### Window Rules ###
####################

# To Get appid or title, use xprox, like xprop | grep WM_NAME
# or badass mmsh -g -c




# Thunar File Manager
windowrule=isfloating:1,width:900,height:600,animation_type_open:zoom,animation_type_close:zoom,appid:Thunar

# Pavucontrol
windowrule=isfloating:1,width:500,height:300,offsetx:100,offsety:-100,animation_type_open:slide,animation_type_close:slide,appid:org.pulseaudio.pavucontrol

#Blueman-manager
windowrule=isfloating:1,width:550,height:300,offsetx:100,offsety:-100,animation_type_open:slide,animation_type_open:slide,appid:blueman-manager

### GAMES

# Steam
windowrule=isfloating:1,width:300,height:600,title:Friends List
windowrule=isfloating:1,title:Steam Settings

# Prism Launcher
windowrule=isfloating:1,width:300,height:900,title:Console window
windowrule=isfloating:1,appid:Minecraft

# Mod Organizer 2
windowrule=isnoborder:1,title:ModOrganizer
windowrule=isfloating:1,width:900,height:600,title:STALKER Anomaly – Mod Organizer v2.5.2
