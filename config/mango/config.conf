# Import
source=~/.config/mango/binds.conf
source=~/.config/mango/input.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/theme.conf
source=~/.config/mango/layouts.conf
source-optional=~/.config/mango/colors.conf

# Monitors
allow_tearing=1

# Desktop
monitor_rule=name:HDMI-A-1,width:1920,height:1080,refresh:75,x:0,y:160
monitor_rule=name:DP-3,width:2560,height:1440,refresh:200,x:1920,y:0

# Victus Laptop
monitor_rule=name:eDP-1,width:1920,height:1080,refresh:144,x:0,y:0


# Autostart
exec_once = waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css
exec_once = awww-daemon
exec_once = awww img /home/astosolo/Pictures/Wallpapers/green-bambo.jpg
exec_once=systemctl --user import-environment XDG_CURRENT_DESKTOP WAYLAND_DISPLAY
exec_once = easyeffect
exec_once = veilad

exec_once=wl-paste --watch cliphist store

